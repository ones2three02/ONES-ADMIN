spring:
  config:
    import: []
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:ones-admin-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  data:
    redis:
      host: localhost
      port: 6379
      password:
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 86400
  active-timeout: -1
  is-concurrent: true
  is-share: false
  is-read-header: true
  is-read-body: false
  is-read-cookie: false
  is-print: false

ones:
  bootstrap:
    enabled: true
    admin-username: admin
    admin-display-name: 系统管理员
    admin-password: admin123
  security:
    session:
      storage: memory
    public-endpoints:
      api-docs-public: false
      actuator-public: false
    web:
      allowed-origins:
        - http://localhost:5173
    login-rate-limit:
      enabled: true
      storage: memory
      account-max-attempts: 5
      ip-max-attempts: 50
      window: 5m
      block-duration: 15m
    oauth:
      storage: memory
      state-ttl: 5m
      ticket-ttl: 60s
    repeat-submit:
      storage: memory
  file:
    storage-type: local
    upload-root: ${java.io.tmpdir}/ones-admin-test-uploads
  events:
    broker: none
  auth:
    feishu:
      enabled: false
