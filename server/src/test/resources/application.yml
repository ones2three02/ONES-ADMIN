spring:
  config:
    import: []
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:ones-admin-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  data:
    redis:
      host: localhost
      port: 6379
      password:
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 86400
  active-timeout: -1
  is-concurrent: true
  is-share: false
  is-read-header: true
  is-read-body: false
  is-read-cookie: false
  is-print: false

ones:
  file:
    upload-root: ${java.io.tmpdir}/ones-admin-test-uploads
