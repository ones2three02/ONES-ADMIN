server:
  port: 8080

spring:
  application:
    name: ones-admin-server
  config:
    import:
      - optional:classpath:application-local.yml
      - optional:file:./config/application-local.yml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${ONES_DB_URL:jdbc:mysql://localhost:3306/ones_admin?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${ONES_DB_USERNAME:ones_admin}
    password: ${ONES_DB_PASSWORD:}
  sql:
    init:
      mode: always
  data:
    redis:
      host: ${ONES_REDIS_HOST:localhost}
      port: ${ONES_REDIS_PORT:6379}
      password: ${ONES_REDIS_PASSWORD:}
      database: ${ONES_REDIS_DATABASE:0}
      timeout: 3s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 0
  rabbitmq:
    host: ${ONES_RABBITMQ_HOST:localhost}
    port: ${ONES_RABBITMQ_PORT:5672}
    username: ${ONES_RABBITMQ_USERNAME:guest}
    password: ${ONES_RABBITMQ_PASSWORD:guest}
    virtual-host: ${ONES_RABBITMQ_VHOST:/}
    connection-timeout: 3s
  servlet:
    multipart:
      max-file-size: ${ONES_FILE_MAX_SIZE:20MB}
      max-request-size: ${ONES_FILE_MAX_SIZE:20MB}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 86400
  active-timeout: -1
  is-concurrent: true
  is-share: false
  is-read-header: true
  is-read-body: false
  is-read-cookie: false
  is-print: false

ones:
  version: ${ONES_ADMIN_VERSION:v0.0.6}
  security:
    login:
      max-failed-login-count: ${ONES_LOGIN_MAX_FAILED_COUNT:5}
      lock-duration: ${ONES_LOGIN_LOCK_DURATION:15m}
    repeat-submit:
      enabled: ${ONES_REPEAT_SUBMIT_ENABLED:true}
      storage: ${ONES_REPEAT_SUBMIT_STORAGE:redis}
  file:
    upload-root: ${ONES_FILE_UPLOAD_ROOT:uploads}
    public-url-prefix: ${ONES_FILE_PUBLIC_URL_PREFIX:/api/system/files}
    max-size: ${ONES_FILE_MAX_SIZE:20MB}
    allowed-extensions:
      - jpg
      - jpeg
      - png
      - gif
      - webp
      - pdf
      - doc
      - docx
      - xls
      - xlsx
      - txt
      - csv
      - zip

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    level: "%5p [%X{traceId}]"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
